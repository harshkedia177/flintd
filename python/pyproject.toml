[project]
name = "flintd"
version = "0.1.0"
description = "Python client for the flintd daemon: the Tools an agent writes for itself, in the shape each provider asks for."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "flintd contributors" }]
keywords = ["ai-agents", "agent-tools", "tool-use", "mcp", "llm", "sandbox"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/harshkedia177/flintd"
Repository = "https://github.com/harshkedia177/flintd"
Issues = "https://github.com/harshkedia177/flintd/issues"

[project.optional-dependencies]
pydantic-ai = ["pydantic-ai-slim>=2.43,<3"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.7", "mypy==2.3.1", "pydantic-ai-slim==2.43.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flintd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true

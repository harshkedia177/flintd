<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img"
     aria-label="A tool becomes a Draft once its own examples pass, Verified once held-out examples pass, and Active after five clean calls.">
  <style>
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .panel { fill: #0d1117; stroke: #21262d; }
    .card  { fill: #161b22; stroke: #30363d; }
    .a1 { fill: #d29922; } .a2 { fill: #388bfd; } .a3 { fill: #3fb950; }
    .name { font-size: 21px; font-weight: 600; text-anchor: middle; }
    .t1 { fill: #e3b341; } .t2 { fill: #58a6ff; } .t3 { fill: #56d364; }
    .sub  { font-size: 12.5px; fill: #8b949e; text-anchor: middle; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #8b949e; text-anchor: middle; }
    .pill { fill: #0d1117; stroke: #30363d; }
    .wire { stroke: #30363d; stroke-width: 1.5; fill: none; }
    .eyebrow { font-size: 11.5px; fill: #6e7681; letter-spacing: 1.4px; }
    .foot { font-size: 12.5px; fill: #6e7681; }
    .dot { fill: #58a6ff; opacity: 0; animation: run 9s linear infinite; }
    @keyframes run {
      0%,4%    { transform: translateX(0px);   opacity: 0 }
      6%       { transform: translateX(10px);  opacity: 1 }
      18%      { transform: translateX(180px); opacity: 1 }
      20%      { transform: translateX(190px); opacity: 0 }
      36%      { transform: translateX(400px); opacity: 0 }
      38%      { transform: translateX(410px); opacity: 1 }
      50%      { transform: translateX(550px); opacity: 1 }
      52%      { transform: translateX(560px); opacity: 0 }
      68%      { transform: translateX(760px); opacity: 0 }
      70%      { transform: translateX(770px); opacity: 1 }
      82%      { transform: translateX(910px); opacity: 1 }
      84%,100% { transform: translateX(920px); opacity: 0 }
    }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none } }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#30363d"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="249" rx="14" class="panel"/>
  <text x="40" y="38" class="eyebrow">HOW A TOOL EARNS ITS PLACE</text>

  <line x1="40"  y1="140" x2="230" y2="140" class="wire" marker-end="url(#a)"/>
  <line x1="440" y1="140" x2="600" y2="140" class="wire" marker-end="url(#a)"/>
  <line x1="800" y1="140" x2="960" y2="140" class="wire" marker-end="url(#a)"/>

  <rect x="240" y="92" width="200" height="96" rx="10" class="card"/>
  <rect x="240" y="92" width="4" height="96" rx="2" class="a1"/>
  <text x="340" y="131" class="name t1">Draft</text>
  <text x="340" y="155" class="sub">its own session only</text>

  <rect x="600" y="92" width="200" height="96" rx="10" class="card"/>
  <rect x="600" y="92" width="4" height="96" rx="2" class="a2"/>
  <text x="700" y="131" class="name t2">Verified</text>
  <text x="700" y="155" class="sub">any session finds it</text>

  <rect x="960" y="92" width="200" height="96" rx="10" class="card"/>
  <rect x="960" y="92" width="4" height="96" rx="2" class="a3"/>
  <text x="1060" y="131" class="name t3">Active</text>
  <text x="1060" y="155" class="sub">in the default tool list</text>

  <rect x="69"  y="125" width="132" height="30" rx="15" class="pill"/>
  <text x="135" y="144" class="mono">its own examples</text>
  <rect x="450" y="125" width="140" height="30" rx="15" class="pill"/>
  <text x="520" y="144" class="mono">held-out examples</text>
  <rect x="824" y="125" width="112" height="30" rx="15" class="pill"/>
  <text x="880" y="144" class="mono">5 clean calls</text>

  <circle cx="40" cy="140" r="4" class="dot"/>

  <text x="40" y="221" class="foot">A model calls tool_create. Every version is a commit, and a Tool that stops earning its place is retired, kept, and restorable.</text>
</svg>
